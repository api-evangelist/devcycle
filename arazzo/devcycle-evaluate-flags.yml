arazzo: 1.0.1
info:
  title: DevCycle - evaluate feature flags for a user (Bucketing API)
  version: 1.0.0
  summary: Fetch all variables and features for a user context and report an event.
  x-realizes-capability-ids:
  - BC-4210.50
  x-capability-derivation:
    method: 'deterministic join: sourceDescriptions -> per-tag OpenAPI -> tag/capability edge. No classification at this step.'
    min_confidence: 0.7
    sources:
    - capability_id: BC-4210.50
      capability_name: Feature Flag Management
      spec: devcycle-bucketing-api-api-openapi.yml
      confidence: 0.85
    model: Turbo EA Capabilities by Vincent Verdet — Turbo EA, https://github.com/vincentmakes/turbo-ea-capabilities, CC BY 4.0
sourceDescriptions:
- name: bucketingApiApi
  url: ../openapi/devcycle-bucketing-api-api-openapi.yml
  type: openapi
workflows:
- workflowId: evaluateForUser
  summary: Get all variables and features for a user, then post a tracking event.
  inputs:
    type: object
    properties:
      user_id:
        type: string
  steps:
  - stepId: getVariables
    operationId: getVariables
    requestBody:
      contentType: application/json
      payload:
        user_id: $inputs.user_id
    successCriteria:
    - condition: $statusCode == 200
  - stepId: getFeatures
    operationId: getFeatures
    requestBody:
      contentType: application/json
      payload:
        user_id: $inputs.user_id
    successCriteria:
    - condition: $statusCode == 200
  - stepId: postEvent
    operationId: postEvents
    requestBody:
      contentType: application/json
      payload:
        user:
          user_id: $inputs.user_id
        events:
        - type: customEvent
    successCriteria:
    - condition: $statusCode == 201
