aid: devcycle
name: DevCycle
description: >-
  DevCycle is an OpenFeature-native feature flag and feature management platform (a
  Dynatrace company) for creating, targeting, rolling out, and cleaning up feature
  flags without disrupting developer workflow. It exposes a Management API for
  administering projects, environments, features, variables, variations, and
  audiences, and a Bucketing API for server-side flag evaluation, backed by client
  and server SDKs across every major language, OpenFeature providers, a `dvc` CLI,
  a Terraform provider, and an official hosted MCP server for AI coding agents.
url: https://raw.githubusercontent.com/api-evangelist/devcycle/refs/heads/main/apis.yml
